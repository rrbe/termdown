name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: make fmt-check

  clippy:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Runtime library only (no -dev): proves the build needs neither the
      # fontconfig dev package nor pkg-config (font-kit uses dlopen on Linux),
      # while still exercising the runtime font-discovery path.
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: make lint

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        # Runtime library only (no -dev): the build loads fontconfig via dlopen,
        # so only the shared library is needed at run time.
        #
        # font-kit pulls freetype-sys unconditionally on Linux, and it links the
        # host's libfreetype whenever pkg-config finds a freetype2.pc. The runner
        # image ships that .pc but not the matching libfreetype.so dev symlink, so
        # the link fails. Point pkg-config at an empty dir to hide the .pc: this
        # makes freetype-sys compile its bundled copy (static) instead — the same
        # path `cargo install` takes on a bare server with no dev packages.
        run: |
          sudo apt-get update && sudo apt-get install -y libfontconfig1
          mkdir -p "$RUNNER_TEMP/empty-pkgconfig"
          echo "PKG_CONFIG_LIBDIR=$RUNNER_TEMP/empty-pkgconfig" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: make build
        shell: bash
      - run: make test
        shell: bash
